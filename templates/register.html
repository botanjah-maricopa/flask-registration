<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Registration</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 420px; margin: 40px auto; }
        label { display: block; margin-top: 12px; font-weight: bold; }
        input { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 16px; padding: 10px 18px; }
        .error { color: #b00020; margin-top: 12px; }
        .success { background: #e8f5e9; padding: 12px; margin-top: 12px; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Register</h1>

    {% if errors %}
        <div class="error">
            <ul>
                {% for e in errors %}<li>{{ e }}</li>{% endfor %}
            </ul>
        </div>
    {% endif %}

    {% if success %}
        <div class="success">
            <h2>Registration Successful</h2>
            <p><strong>Full Name:</strong> {{ full_name }}</p>
            <p><strong>Username:</strong> {{ username }}</p>
            <p><strong>Hashed Password:</strong> {{ hashed }}</p>
        </div>
    {% endif %}

    <form method="POST" action="/register">
        <label for="full_name">Full Name</label>
        <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}">

        <label for="username">Username</label>
        <input type="text" id="username" name="username" value="{{ username or '' }}">

        <label for="password">Password</label>
        <input type="password" id="password" name="password">

        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password">

        <button type="submit">Register</button>
    </form>
</body>
</html>
